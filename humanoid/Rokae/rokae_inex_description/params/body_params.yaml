# 躯干参数配置（不含力控相关参数）(TaiHu)
# 有效轴数与 robot_model.yaml groups.body.dof 对齐（本机 4）

mech:
  motor:
    AXIS_NUM: 4
    ENCODER_RESOLUTION: [7929856, 262144, 262144, 262144]
    RATED_TORQUE: [1.3967, 1.3967, 1.3967, 0.6942]
    TORQUE_OVERLOAD_FACTOR: [1.0, 1.0, 1.0, 1.0]
    PEAK_TORQUE: [3.6033, 3.6033, 3.6033, 1.7107]
    ENCODER_ZERO_OFFSET: [0, 0, 0, 0]
  transmission:
    REDUCTION_RATIO_NUMERATOR: [1, -1, 1, 1]
    REDUCTION_RATIO_DENOMINATOR: [1, 1, 1, 1]

# 运行安全阈值（反馈速度 rad/s；按 ControlMode 分套：位置最松）
# 本期 Controller 仅判定并发布 controller/safety_status，不直接驱动 HW 停机
safety:
  enabled: false
  debounce_ticks: 5
  joint_vel_limit_position_rad_s:  [1.88, 1.88, 1.88, 2.40]
  joint_vel_limit_impedance_rad_s: [1.88, 1.88, 1.88, 2.40]
  joint_vel_limit_dragging_rad_s:  [1.88, 1.88, 1.88, 2.40]
