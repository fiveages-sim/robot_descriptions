robot_model:
  urdf: rokae_inex_description/xacro/robot.xacro
  base_frame: base_link  # 模型基座 link；笛卡尔 WholeBodyBase 仍用 pinocchio world
  default_robot_mode: DualArmOnly
  total_dof: 20

  # 机型分区（必填）：声明本机有哪些 body/head/left_arm/right_arm
  parts:
    body: true
    head: true
    left_arm: true
    right_arm: true

  groups:
    body:
      dof: 4
      joints:
        - body_joint1
        - body_joint2
        - body_joint3
        - body_joint4
    head:
      dof: 2
      joints:
        - head_joint1
        - head_joint2
    left:
      dof: 7
      joints:
        - left_joint1
        - left_joint2
        - left_joint3
        - left_joint4
        - left_joint5
        - left_joint6
        - left_joint7
      ee_frame: left_tcp
      local_base_frame: left_base_link
      elbow_frame: left_link4
    right:
      dof: 7
      joints:
        - right_joint1
        - right_joint2
        - right_joint3
        - right_joint4
        - right_joint5
        - right_joint6
        - right_joint7
      ee_frame: right_tcp
      local_base_frame: right_base_link
      elbow_frame: right_link4
