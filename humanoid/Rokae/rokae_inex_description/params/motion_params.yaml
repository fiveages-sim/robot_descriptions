# Robot motion planning defaults (loaded by plan_config.cpp)
#
# 关节数组长度 = robot_model.yaml groups.*.dof（有效轴），不是 wire 容量。
# 笛卡尔为每 part 标量；Jog 与轨迹的 vel/acc/jerk 均分开。
# 前缀：left_arm_ / right_arm_（本机 parts.body/head=false，不写 body_/head_）
#
# 无全局运动学 fallback：在场分区必须写全下列键（由加载器 check）。

control_period_s: 0.001
state_wait_timeout_ms: 20000
topic_log_interval_ticks: 1000

# servoj / servol 跟踪增益（仅此四个；限幅改用各 part 的 joint_max_*）
servo_lookahead_s: 0.10
servo_damping_ratio: 1.35
servo_ff_filter_tau_s: 0.025
servo_ff_gain: 0.75

waypoint_joint_blend_deg: 5.0
waypoint_cart_blend_m: 0.02
waypoint_cart_blend_deg: 5.0

# ── Left arm (dof=7) ──────────────────────────────────────────────────────────
left_arm_joint_max_vel_deg_s: [87.5, 87.5, 135, 150, 120, 120, 120]
left_arm_joint_max_acc_deg_s2: [650, 500, 1250, 1250, 2500, 2500, 2500]
left_arm_joint_max_jerk_deg_s3: [6500, 5000, 10000, 10000, 20000, 20000, 20000]
left_arm_jog_max_vel_deg_s: [60, 60, 60, 60, 60, 60, 60]
left_arm_jog_max_acc_deg_s2: [100, 100, 100, 100, 120, 120, 120]
left_arm_jog_max_jerk_deg_s3: [500, 500, 500, 500, 600, 600, 600]
left_arm_cart_linear_vel_m_s: 0.2
left_arm_cart_linear_acc_m_s2: 1
left_arm_cart_angular_vel_rad_s: 0.3
left_arm_cart_angular_acc_rad_s2: 0.5
left_arm_cart_max_jerk: 2.0
left_arm_cart_jog_linear_vel_m_s: 0.1
left_arm_cart_jog_linear_acc_m_s2: 0.5
left_arm_cart_jog_angular_vel_rad_s: 0.1
left_arm_cart_jog_angular_acc_rad_s2: 0.5
left_arm_cart_jog_max_jerk: 2.0
left_arm_cart_jog_elbow_vel_rad_s: 0.3
left_arm_cart_jog_elbow_acc_rad_s2: 1.0
left_arm_soft_min_deg: [-178, -120, -178, -60, -178, -60, -90]
left_arm_soft_max_deg: [178, 120, 178, 145, 178, 60, 90]

# ── Right arm (dof=7；运动参数与左臂一致，软限位独立) ─────────────────────────
right_arm_joint_max_vel_deg_s: [87.5, 87.5, 135, 150, 120, 120, 120]
right_arm_joint_max_acc_deg_s2: [650, 500, 1250, 1250, 2500, 2500, 2500]
right_arm_joint_max_jerk_deg_s3: [6500, 5000, 10000, 10000, 20000, 20000, 20000]
right_arm_jog_max_vel_deg_s: [60, 60, 60, 60, 60, 60, 60]
right_arm_jog_max_acc_deg_s2: [100, 100, 100, 100, 120, 120, 120]
right_arm_jog_max_jerk_deg_s3: [500, 500, 500, 500, 600, 600, 600]
right_arm_cart_linear_vel_m_s: 0.2
right_arm_cart_linear_acc_m_s2: 1
right_arm_cart_angular_vel_rad_s: 0.3
right_arm_cart_angular_acc_rad_s2: 0.5
right_arm_cart_max_jerk: 2.0
right_arm_cart_jog_linear_vel_m_s: 0.1
right_arm_cart_jog_linear_acc_m_s2: 0.5
right_arm_cart_jog_angular_vel_rad_s: 0.1
right_arm_cart_jog_angular_acc_rad_s2: 0.5
right_arm_cart_jog_max_jerk: 2.0
right_arm_cart_jog_elbow_vel_rad_s: 0.3
right_arm_cart_jog_elbow_acc_rad_s2: 1.0
right_arm_soft_min_deg: [-178, -120, -178, -60, -178, -60, -90]
right_arm_soft_max_deg: [178, 120, 178, 145, 178, 60, 90]
