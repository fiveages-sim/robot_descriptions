/**:
  ros__parameters:
    # Linear / angular scales: map full stick to */twist caps (m/s, rad/s)
    linear_scale: 0.1
    angular_scale: 0.25

    # split_body / fixed-base: markers in base_footprint (coincides with base_link on Taku).
    # full_body + mobile (modelType 1/4): launch + parse_task_info override both
    # marker_fixed_frame and control_base_frame to world (OCS2 EE targets are world).
    # Keep vr_follow_frame on footprint so VR stays chassis-relative before convert-to-world.
    marker_fixed_frame: base_footprint
    enable_vr: true
    vr_follow_frame: base_footprint
    enable_wbc_head_tracking_marker: false
    # Taku last head link (= W2 head_link2 role)
    head_link_name: "head_roll_link"
    # VR headset calibration reference (W2: head_link2)
    reference_link: "head_roll_link"
