/**:
  ros__parameters:
    # 手柄/键盘 → */twist 上限（满杆），与 FiveAges W2 / arms_target_manager 默认一致
    linear_scale: 0.1
    angular_scale: 0.25

    marker_fixed_frame: base_footprint
    enable_vr: true
    vr_follow_frame: base_footprint
    enable_head_control: false
    enable_wbc_head_tracking_marker: false

    head_joint_to_rpy_mapping:
      head_joint1: "head_yaw"
      head_joint2: "head_pitch"

    head_rpy_axis_direction:
      head_yaw: 1.0
      head_pitch: 1.0
      head_roll: 1.0

    head_link_name: "head_link2"
    reference_link: "head_link2"
