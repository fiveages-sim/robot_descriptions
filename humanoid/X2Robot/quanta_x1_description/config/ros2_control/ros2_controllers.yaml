# ros2_control configuration for X2Robot Quanta X1.
controller_manager:
  ros__parameters:
    update_rate: 100

    joint_state_broadcaster:
      type: joint_state_broadcaster/JointStateBroadcaster

    ocs2_arm_controller:
      type: ocs2_arm_controller/Ocs2ArmController

    body_joint_controller:
      type: basic_joint_controller/BasicJointController

    head_joint_controller:
      type: basic_joint_controller/BasicJointController

    left_gripper_controller:
      type: adaptive_gripper_controller/AdaptiveGripperController

    right_gripper_controller:
      type: adaptive_gripper_controller/AdaptiveGripperController

ocs2_arm_controller:
  ros__parameters:
    update_rate: 100
    mpc_frequency: 50
    info_file_name: fixed_base
    joints:
      - lift_joint
      - left_joint1
      - left_joint2
      - left_joint3
      - left_joint4
      - left_joint5
      - left_joint6
      - right_joint1
      - right_joint2
      - right_joint3
      - right_joint4
      - right_joint5
      - right_joint6

    command_interfaces:
      - position
    state_interfaces:
      - position

    robot_name: quanta_x1
    home_duration: 2.0
    home_1: [
      0.10,
      0.0, 0.30, -0.30, 0.0, 0.0, 0.0,
      0.0, 0.30, -0.30, 0.0, 0.0, 0.0
    ]
    home_2: [
      0.10,
      0.0, 0.60, -0.60, 0.0, 0.0, 0.0,
      0.0, 0.60, -0.60, 0.0, 0.0, 0.0
    ]
body_joint_controller:
  ros__parameters:
    update_rate: 100
    joints:
      - lift_joint
    command_interfaces:
      - position
    state_interfaces:
      - position
      - velocity
    home_1: [0.10]
    home_2: [0.30]
    home_duration: 2.0
    movej_duration: 2.0
    hold_position_threshold: 0.1

head_joint_controller:
  ros__parameters:
    update_rate: 100
    joints:
      - head_yaw_joint
      - head_pitch_joint
    command_interfaces:
      - position
    state_interfaces:
      - position
      - velocity
    home_1: [0.0, 0.20]
    home_2: [0.0, 0.0]
    home_duration: 2.0
    movej_duration: 2.0
    hold_position_threshold: 0.1

left_gripper_controller:
  ros__parameters:
    joint: left_gripper_joint
    force_feedback_ratio: 0.1
    force_threshold: 1.5

right_gripper_controller:
  ros__parameters:
    joint: right_gripper_joint
    force_feedback_ratio: 0.1
    force_threshold: 1.5
