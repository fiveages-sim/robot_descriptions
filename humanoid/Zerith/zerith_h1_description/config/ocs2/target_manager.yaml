/**:
  ros__parameters:
    linear_scale: 0.3
    angular_scale: 0.5
    enable_vr: true

    # split_body / fixed-base: markers in base_footprint (ground; deck = +0.18).
    # full_body + mobile (modelType 1): emit_control forces marker/control to world.
    # Keep vr_follow_frame on footprint (SE2 / Isaac odom child) before convert-to-world.
    marker_fixed_frame: base_footprint
    vr_follow_frame: base_footprint
    # Only full_body.launch.py turns this on for Ocs2WbcController
    enable_wbc_head_tracking_marker: false

    # Last head link (yaw -> pitch): W2 head_link2 role. Used to init the HEAD_TRACKING target pose.
    head_link_name: "neck_pitch_link"
    # VR headset calibration reference (W2: head_link2)
    reference_link: "neck_pitch_link"
