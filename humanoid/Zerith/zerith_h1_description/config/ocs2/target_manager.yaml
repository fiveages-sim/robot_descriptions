/**:
  ros__parameters:
    linear_scale: 0.3
    angular_scale: 0.5
    enable_vr: true

    # split_body / fixed-base: markers in base_footprint (identity to base_link).
    # full_body + mobile (modelType 1): launch + parse_task_info override both
    # marker_fixed_frame and control_base_frame to world (OCS2 EE targets are world).
    # Keep vr_follow_frame on footprint so VR stays chassis-relative before convert-to-world.
    marker_fixed_frame: base_footprint
    vr_follow_frame: base_footprint
    # Only full_body.launch.py turns this on for Ocs2WbcController
    enable_wbc_head_tracking_marker: false

    # Last head link (yaw -> pitch): W2 head_link2 role. Used to init the HEAD_TRACKING target pose.
    head_link_name: "neck_pitch_link"
    # VR headset calibration reference (W2: head_link2)
    reference_link: "neck_pitch_link"
