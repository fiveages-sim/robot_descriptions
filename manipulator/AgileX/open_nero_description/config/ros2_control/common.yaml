# Common controller defaults for Open Nero (dual Nero arms).

controller_manager:
  ros__parameters:
    update_rate: 100  # Hz

    joint_state_broadcaster:
      type: joint_state_broadcaster/JointStateBroadcaster

    ocs2_arm_controller:
      type: ocs2_arm_controller/Ocs2ArmController

    left_hand_controller:
      type: basic_joint_controller/BasicJointController

    right_hand_controller:
      type: basic_joint_controller/BasicJointController

ocs2_arm_controller:
  ros__parameters:
    update_rate: 100  # Hz
    joints:
      - left_joint1
      - left_joint2
      - left_joint3
      - left_joint4
      - left_joint5
      - left_joint6
      - left_joint7
      - right_joint1
      - right_joint2
      - right_joint3
      - right_joint4
      - right_joint5
      - right_joint6
      - right_joint7

    command_interfaces:
      - position
    state_interfaces:
      - position

    future_time_offset: 1.0
    robot_name: open_nero
    mpc_frequency: 50

    home_1: [0.0, 1.5708, -1.5708, 1.5708, 0.0, 0.0, 0.0,
             0.0, 1.5708, 1.5708, 1.5708, 0.0, 0.0, 0.0]
