controller_manager:
  ros__parameters:
    update_rate: 100

    arm_controller:
      type: joint_trajectory_controller/JointTrajectoryController

    hand_controller:
      type: adaptive_gripper_controller/AdaptiveGripperController

    joint_state_broadcaster:
      type: joint_state_broadcaster/JointStateBroadcaster

    ocs2_arm_controller:
      type: ocs2_arm_controller/Ocs2ArmController

arm_controller:
  ros__parameters:
    command_interfaces:
      - position
    state_interfaces:
      - position
      - velocity
    joints:
      - joint1
      - joint2
      - joint3
      - joint4
      - joint5
      - joint6

hand_controller:
  ros__parameters:
    joint: joint7
    use_effort_interface: false
    force_feedback_ratio: 1.0
    force_threshold: 2.0

ocs2_arm_controller:
  ros__parameters:
    update_rate: 50
    joints:
      - joint1
      - joint2
      - joint3
      - joint4
      - joint5
      - joint6
    command_interfaces:
      - position
    state_interfaces:
      - position
    robot_name: piper_l
    future_time_offset: 2.0
    home_pos: [0.0, 0.5, -0.35, 0.0, 0.0, 0.0]